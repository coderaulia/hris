name: Playwright Regression

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  regression-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Dummy local-Supabase values — no real project needed.
    # Tests in this job use page.route() to intercept all network calls,
    # so the Supabase client never actually connects to anything.
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxvY2FsaG9zdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjkwMDAwMDAwLCJleHAiOjk5OTk5OTk5OTl9.local-dev-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright's webServer config (playwright.config.js) starts the Vite
      # dev server automatically. No manual server management needed here.
      - name: Run adapter regression tests
        run: npx playwright test tests/backend-adapter.spec.js tests/signature.spec.js
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
