name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    name: Build and hardening QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Schema and security hardening QA
        run: npm run qa:hardening

  laravel:
    name: Laravel tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # composer.lock resolves symfony/* v8 which requires php >= 8.4;
          # composer.json still declares ^8.3 (see docs/code-audit.md finding)
          php-version: '8.4'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: composer ci
